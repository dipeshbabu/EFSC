model_name: distilroberta-base
pair_path: sample_data/train.jsonl
output_dir: outputs/stage2
seed: 42
device: cpu
freeze_backbone: true
bottleneck_dim: 128
max_length: 256
batch_size: 4
epochs: 2
learning_rate: 0.0002
weight_decay: 0.01
warmup_ratio: 0.1
max_grad_norm: 1.0
margin: 0.5
consistency_weight: 0.25
init_checkpoint: outputs/stage1/stage1_best.pt
